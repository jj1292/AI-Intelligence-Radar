name: publish-subscription-feeds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/subscriptions.json"
      - "agent/**"
      - "tools/insight_analysis.py"
      - "reporters/subscription_feed.py"
      - "config/morning-edition.json"
      - "reporters/morning_edition.py"
      - "reporters/hourly_intelligence.py"
      - "reporters/research_trends.py"
      - ".github/workflows/publish-feed.yml"
  schedule:
    - cron: "17 1,13 * * *"
    - cron: "17 0,2-12,14-22 * * *"
    - cron: "17 23 * * *"

permissions:
  contents: write

concurrency:
  group: subscription-feed-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'jj1292/AI-Intelligence-Radar'
    runs-on: ubuntu-latest
    env:
      X_ACCOUNT_USERNAME: ${{ vars.X_ACCOUNT_USERNAME }}
      X_COOKIE_AUTH_TOKEN: ${{ secrets.X_COOKIE_AUTH_TOKEN }}
      X_COOKIE_CT0: ${{ secrets.X_COOKIE_CT0 }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      TWS_TELEMETRY: "0"

    steps:
      - name: Check publisher settings
        id: publisher-settings
        shell: bash
        run: |
          if [[ -n "$X_ACCOUNT_USERNAME" && -n "$X_COOKIE_AUTH_TOKEN" && -n "$X_COOKIE_CT0" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::X publisher settings are not configured; publishing public sources only."
          fi
          if [[ -n "$FIRECRAWL_API_KEY" ]]; then
            echo "firecrawl-configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "firecrawl-configured=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Configure publisher account
        id: x-account
        if: steps.publisher-settings.outputs.configured == 'true' && (github.event_name != 'schedule' || github.event.schedule == '17 1,13 * * *')
        continue-on-error: true
        env:
          X_TWSCRAPE_DB: ${{ runner.temp }}/twscrape.db
        run: python -m tools.x_twscrape setup-env

      - name: Collect and publish feeds
        id: collect-feeds
        continue-on-error: true
        timeout-minutes: 8
        if: github.event_name != 'schedule' || github.event.schedule == '17 1,13 * * *'
        env:
          X_PUBLISHER_CONFIGURED: ${{ steps.x-account.outcome == 'success' }}
          X_TWSCRAPE_DB: ${{ runner.temp }}/twscrape.db
          RADAR_STATE_DIR: data/subscriptions/state
        shell: bash
        run: |
          publisher_args=()
          if [[ "$X_PUBLISHER_CONFIGURED" == "true" || "${{ steps.publisher-settings.outputs.firecrawl-configured }}" == "true" ]]; then
            publisher_args+=(--include-auth)
          fi
          python -m agent.runner \
            --config config/subscriptions.json \
            "${publisher_args[@]}" \
            --output outputs/publisher-run \
            --feed-output docs \
            --feed-max-items 200 \
            --hours 72

      - name: Collect medical AI research trends
        if: github.event_name != 'schedule' || github.event.schedule == '17 23 * * *'
        run: python -m reporters.research_trends

      - name: Generate morning edition
        if: github.event_name != 'schedule' || github.event.schedule == '17 23 * * *'
        env:
          RADAR_EDITOR_API_KEY: ${{ secrets.RADAR_EDITOR_API_KEY }}
          RADAR_EDITOR_MODEL: ${{ vars.RADAR_EDITOR_MODEL || 'gpt-4.1-mini' }}
        run: python -m reporters.morning_edition

      - name: Publish hourly headlines and linked signals
        run: python -m reporters.hourly_intelligence

      - name: Commit updated public feeds
        shell: bash
        run: |
          git config user.name "AI Intelligence Radar Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "${{ steps.collect-feeds.outcome }}" == "success" ]]; then
            git add docs/feed.xml docs/feed.json
            if [[ -d data/subscriptions/state/checkpoints ]]; then
              git add data/subscriptions/state/checkpoints
            fi
          fi
          if [[ -f docs/morning-edition.json ]]; then
            git add docs/morning-edition.json docs/morning-edition.xml docs/morning-archive.json docs/editions
          fi
          for file in docs/intelligence.json docs/research-trends.json; do
            if [[ -f "$file" ]]; then
              git add "$file"
            fi
          done
          if git diff --cached --quiet; then
            echo "No new feed items."
            exit 0
          fi
          git commit -m "Update public AI intelligence feeds"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
