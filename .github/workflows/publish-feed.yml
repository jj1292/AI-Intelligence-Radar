name: publish-subscription-feeds

on:
  workflow_dispatch:
  push:
    paths:
      - "config/subscriptions.json"
      - "agent/**"
      - "tools/insight_analysis.py"
      - "reporters/subscription_feed.py"
      - ".github/workflows/publish-feed.yml"
  schedule:
    - cron: "17 1,13 * * *"

permissions:
  contents: write
  models: read

concurrency:
  group: subscription-feed-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'jj1292/AI-Intelligence-Radar'
    runs-on: ubuntu-latest
    env:
      X_ACCOUNT_USERNAME: ${{ vars.X_ACCOUNT_USERNAME }}
      X_COOKIE_AUTH_TOKEN: ${{ secrets.X_COOKIE_AUTH_TOKEN }}
      X_COOKIE_CT0: ${{ secrets.X_COOKIE_CT0 }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RADAR_ANALYSIS_MODEL: openai/gpt-4.1
      TWS_TELEMETRY: "0"

    steps:
      - name: Check publisher settings
        id: publisher-settings
        shell: bash
        run: |
          if [[ -n "$X_ACCOUNT_USERNAME" && -n "$X_COOKIE_AUTH_TOKEN" && -n "$X_COOKIE_CT0" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::X publisher settings are not configured; publishing public sources only."
          fi
          if [[ -n "$FIRECRAWL_API_KEY" ]]; then
            echo "firecrawl-configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "firecrawl-configured=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Configure publisher account
        if: steps.publisher-settings.outputs.configured == 'true'
        env:
          X_TWSCRAPE_DB: ${{ runner.temp }}/twscrape.db
        run: python -m tools.x_twscrape setup-env

      - name: Collect and publish feeds
        env:
          X_PUBLISHER_CONFIGURED: ${{ steps.publisher-settings.outputs.configured }}
          X_TWSCRAPE_DB: ${{ runner.temp }}/twscrape.db
          RADAR_STATE_DIR: data/subscriptions/state
        shell: bash
        run: |
          publisher_args=()
          if [[ "$X_PUBLISHER_CONFIGURED" == "true" || "${{ steps.publisher-settings.outputs.firecrawl-configured }}" == "true" ]]; then
            publisher_args+=(--include-auth)
          fi
          python -m agent.runner \
            --config config/subscriptions.json \
            "${publisher_args[@]}" \
            --output outputs/publisher-run \
            --feed-output docs \
            --feed-max-items 200 \
            --hours 72

      - name: Commit updated public feeds
        shell: bash
        run: |
          git config user.name "AI Intelligence Radar Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml docs/feed.json
          if [[ -d data/subscriptions/state/checkpoints ]]; then
            git add data/subscriptions/state/checkpoints
          fi
          if git diff --cached --quiet; then
            echo "No new feed items."
            exit 0
          fi
          git commit -m "Update public AI intelligence feeds"
          git push origin HEAD:main
