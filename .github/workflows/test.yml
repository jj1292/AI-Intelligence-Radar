name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Render AI Pulse output
        run: python -m reporters.daily_briefing --input examples/intelligence_signals.json --output /tmp/ai-radar --date 2026-07-22
      - name: Validate source registry
        run: python source_registry.py --config config/sources.json
      - name: Build sample knowledge base
        run: python build_knowledge_base.py --input examples/intelligence_signals.json --output /tmp/ai-radar --date 2026-07-22
      - name: Run evaluation baseline
        run: python evaluate_radar.py --cases evals/cases.jsonl --output /tmp/evaluation-report.md --strict

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Build public website
        working-directory: web
        run: npm run build
      - name: Test static hosting worker
        working-directory: web
        run: npm run test:sites
